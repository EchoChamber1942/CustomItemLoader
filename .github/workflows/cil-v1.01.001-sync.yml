name: Sync CustomItemLoader v1.01.001

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cil-v1.01.001-sync.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply verified Rust compatibility patch
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          p = Path('CustomItemLoader.cs')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('[Info("CustomItemLoader", "EchoChamber", "1.00.000")]',
               '[Info("CustomItemLoader", "EchoChamber", "1.01.001")]'),

              ('''                    case "runspeed":\n                        player.ClientRPCPlayer(null, player, "SetPlayerSpeed", "Movement", kv.Value);\n                        LogCil("DEBUG", $"Applied runspeed {kv.Value} to {player.displayName}");''',
               '''                    case "runspeed":\n                        // Rust 2026-07+: SetPlayerSpeed RPC now expects a byte mode instead of the old string "Movement".\n                        // Disable this legacy passive safely until the current mode mapping is confirmed.\n                        LogWarn($"runspeed passive is temporarily disabled on current Rust API (requested multiplier: {kv.Value}).");\n                        LogCil("DEBUG", $"Applied runspeed {kv.Value} to {player.displayName}");'''),

              ('''            // スピードリセット\n            player.ClientRPCPlayer(null, player, "SetPlayerSpeed", "Movement", 1f);\n            LogCil("DEBUG", $"Reset player speed for {player.displayName}");''',
               '''            // スピードリセット\n            // Rust 2026-07+: legacy SetPlayerSpeed("Movement", ...) signature was removed.\n            // No RPC reset is sent because runspeed application is disabled above.\n            LogCil("DEBUG", $"Reset player speed for {player.displayName}");'''),

              ('player.ClientRPCPlayer(null, player, "ForcePositionTo", player.transform.position + jumpVelocity);',
               'player.ClientRPC(RpcTarget.Player("ForcePositionTo", player), player.transform.position + jumpVelocity);'),

              ('string playerName = arg.Args[0];',
               'string playerName = arg.Args[0].ToString();'),
              ('string shortname = arg.Args[1];',
               'string shortname = arg.Args[1].ToString();'),
              ('if (arg.Args.Length > 2 && !int.TryParse(arg.Args[2], out amount)) amount = 1;',
               'if (arg.Args.Length > 2 && !int.TryParse(arg.Args[2].ToString(), out amount)) amount = 1;'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected source pattern not found:\n{old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8', newline='\n')

          expected = 'e3b9cd7407a0988c29128bc594cc16e099cb0f4bd9da0c219906f402a07dead5'
          actual = hashlib.sha256(p.read_bytes()).hexdigest()
          print('Expected SHA256:', expected)
          print('Actual   SHA256:', actual)
          if actual != expected:
              raise SystemExit('Result does not exactly match the uploaded v1.01.001 source; refusing to commit.')

      - name: Commit exact uploaded source
        run: |
          git config user.name "EchoChamber1942"
          git config user.email "actions@users.noreply.github.com"
          git add CustomItemLoader.cs
          git diff --cached --quiet && exit 0
          git commit -m "fix: Rust API compatibility update v1.01.001"
          git push origin main
